name: Refresh Materialized Views

# ============================================================================
# ALTERNATIVA ao pg_cron: GitHub Actions para refresh das MVs
# ============================================================================
# Usar APENAS se pg_cron não estiver disponível no Supabase
# Executa a cada 5 minutos durante horário comercial (8h-18h BRT)
# ============================================================================

on:
  schedule:
    # A cada 5 minutos, segunda a sexta, 8h-18h (horário UTC)
    # UTC = BRT + 3h, então 11h-21h UTC = 8h-18h BRT
    - cron: '*/5 11-21 * * 1-5'

  # Permitir trigger manual
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh all MVs'
        required: false
        default: 'true'

jobs:
  refresh-views:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refresh all materialized views
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔄 Refreshing materialized views..."

          # Chamar função RPC do Supabase
          response=$(curl -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/refresh_all_materialized_views" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail)

          # Parse e mostrar resultados
          echo "✅ Refresh completed successfully!"
          echo "$response" | jq -r '.[] | "\(.view_name): \(.duration_ms)ms"'

      - name: Get MV metadata
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "📊 Materialized Views Metadata:"

          metadata=$(curl -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/get_mv_metadata" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --silent --show-error --fail)

          echo "$metadata" | jq -r '.[] | "\(.view_name): \(.row_count) rows, \(.total_size)"'

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Failed to refresh materialized views!"
          echo "Check Supabase logs for details."
          exit 1

      - name: Log completion time
        if: always()
        run: |
          echo "⏰ Refresh completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🌍 São Paulo time: $(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M:%S BRT')"
