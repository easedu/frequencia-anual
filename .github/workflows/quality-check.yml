# Workflow de verificação de qualidade
# Garante que todas as mudanças atendam aos padrões de qualidade

name: Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint

    - name: Type check
      run: npm run type-check

    - name: Run tests
      run: npm run test:ci

    - name: Check for hard-coded years
      run: npm run check:years

    - name: Security audit
      run: npm audit --audit-level=moderate

    - name: Build application
      run: npm run build

    - name: Bundle size analysis
      run: npm run analyze

  performance-check:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Performance audit with Lighthouse CI
      run: |
        npm install -g @lhci/cli@0.12.x
        lhci autorun

  security-check:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
    - uses: actions/checkout@v4

    - name: Run security scan
      uses: securecodewarrior/github-action-security-scan@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for XSS vulnerabilities
      run: npm run security:xss

    - name: Validate input sanitization
      run: npm run test:security