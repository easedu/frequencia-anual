# Workflow de verificação de qualidade
# Garante que todas as mudanças atendam aos padrões de qualidade

name: Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint

    - name: Type check
      run: npm run type-check

    - name: Run tests
      run: npm run test:ci

    - name: Check for hard-coded years
      run: npm run check:years

    - name: Security audit
      run: npm audit --audit-level=moderate

    - name: Build application
      run: npm run build

    - name: Bundle size analysis
      run: |
        npm run analyze
        npm run bundle:monitor
    
    - name: Upload bundle analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis-${{ matrix.node-version }}
        path: |
          bundle-analysis.json
          .next/analyze/
        retention-days: 30
    
    - name: Comment bundle analysis on PR
      if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          try {
            const analysis = JSON.parse(fs.readFileSync('bundle-analysis.json', 'utf8'));
            const maxTotal = Math.max(...analysis.routes.map(r => r.totalSize));
            const maxPage = Math.max(...analysis.routes.map(r => r.pageSize));
            
            let status = '✅';
            if (analysis.errors.length > 0) status = '❌';
            else if (analysis.warnings.length > 0) status = '⚠️';
            
            const comment = `## ${status} Bundle Analysis Report
            
            **Summary:**
            - 📦 Shared JS: ${analysis.sharedSize}KB
            - 📄 Total Routes: ${analysis.routes.length}
            - 📈 Largest Page: ${maxPage}KB
            - 🎯 Largest Total: ${maxTotal}KB
            
            ${analysis.warnings.length > 0 ? `**Warnings:**\n${analysis.warnings.map(w => `- ⚠️ ${w}`).join('\n')}\n\n` : ''}
            ${analysis.errors.length > 0 ? `**Errors:**\n${analysis.errors.map(e => `- ❌ ${e}`).join('\n')}\n\n` : ''}
            
            <details>
            <summary>📊 Detailed Bundle Sizes</summary>
            
            | Route | Page Size | Total Size |
            |-------|-----------|------------|
            ${analysis.routes.map(r => `| ${r.route} | ${r.pageSize}KB | ${r.totalSize}KB |`).join('\n')}
            
            </details>
            
            *Report generated at ${analysis.timestamp}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not generate bundle analysis comment:', error.message);
          }

  performance-check:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Performance audit with Lighthouse CI
      run: |
        npm install -g @lhci/cli@0.12.x
        lhci autorun

  security-check:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
    - uses: actions/checkout@v4

    - name: Run security scan
      uses: securecodewarrior/github-action-security-scan@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for XSS vulnerabilities
      run: npm run security:xss

    - name: Validate input sanitization
      run: npm run test:security